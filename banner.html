<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Capital Shield AI — Telegram Banner</title>
    <style>
        body { margin: 0; padding: 0; background: #0F111A; display: flex; justify-content: center; align-items: center; height: 100vh; }
        svg { background: #0F111A; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }
    </style>
</head>
<body>

    <svg xmlns="http://w3.org" viewBox="0 0 512 512" width="512" height="512">
        <!-- Глубокий темный фон вашего сайта -->
        <rect width="512" height="512" fill="#0F111A"/>
        
        <!-- Технологичные кибер-круги и радар на фоне -->
        <circle cx="256" cy="256" r="220" fill="none" stroke="#00D2FF" stroke-width="1" stroke-dasharray="4,8" opacity="0.15"/>
        <circle cx="256" cy="256" r="160" fill="none" stroke="#00E676" stroke-width="1" stroke-dasharray="2,6" opacity="0.1"/>
        <line x1="256" y1="36" x2="256" y2="476" stroke="#2A2F3F" stroke-width="0.5" opacity="0.3"/>
        <line x1="36" y1="256" x2="476" y2="256" stroke="#2A2F3F" stroke-width="0.5" opacity="0.3"/>

        <!-- Центральный объемный неоновый ЩИТ-ФОРПОСТ -->
        <g transform="translate(256, 245)">
            <!-- Внешнее свечение циана -->
            <path d="M0 -90 L65 -70 L65 20 C65 65 32 100 0 115 C-32 100 -65 65 -65 20 L-65 -70 Z" fill="none" stroke="#00D2FF" stroke-width="8" opacity="0.15"/>
            <!-- Основное тело щита -->
            <path d="M0 -90 L65 -70 L65 20 C65 65 32 100 0 115 C-32 100 -65 65 -65 20 L-65 -70 Z" fill="#161A26" stroke="#00D2FF" stroke-width="3.5"/>
            <!-- Внутренний изумрудный контур (Символ новой услуги) -->
            <path d="M0 -80 L53 -63 L53 15 C53 53 26 82 0 95 C-26 82 -53 15 -53 15 L-53 -63 Z" fill="#1F263A" stroke="#00E676" stroke-width="1.5"/>
            
            <!-- Стилизованная ИИ-микросхема внутри щита -->
            <circle cx="0" cy="0" r="22" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.4"/>
            <line x1="0" y1="-22" x2="0" y2="-45" stroke="#00D2FF" stroke-width="2" opacity="0.5"/>
            <line x1="0" y1="22" x2="0" y2="45" stroke="#00D2FF" stroke-width="2" opacity="0.5"/>
            <line x1="-22" y1="0" x2="-45" y2="0" stroke="#00D2FF" stroke-width="2" opacity="0.5"/>
            <line x1="22" y1="0" x2="45" y2="0" stroke="#00D2FF" stroke-width="2" opacity="0.5"/>
            <circle cx="0" cy="-45" r="4" fill="#00E676"/>
            <circle cx="0" cy="45" r="4" fill="#00E676"/>
            <circle cx="-45" cy="0" r="4" fill="#00E676"/>
            <circle cx="45" cy="0" r="4" fill="#00E676"/>
            
            <!-- Название бренда на щите -->
            <text x="0" y="4" font-family="Segoe UI, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CAPITAL</text>
        </g>

        <!-- ТЕКСТОВЫЕ БЛОКИ БАННЕРА -->
        <text x="256" y="70" font-family="Segoe UI, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CAPITAL SHIELD AI</text>
        <text x="256" y="98" font-family="Segoe UI, sans-serif" font-weight="700" font-size="11" fill="#00D2FF" text-anchor="middle" letter-spacing="2">ИИ-СУВЕРЕНИТЕТ В КИБЕРБЕЗОПАСНОСТИ</text>

        <!-- Плашка цены -->
        <rect x="186" y="390" width="140" height="32" rx="8" fill="#161A26" stroke="#00E676" stroke-width="1"/>
        <text x="256" y="411" font-family="Segoe UI, sans-serif" font-weight="800" font-size="15" fill="#00E676" text-anchor="middle">$10 - $40</text>

        <!-- Адрес вашего официального сайта -->
        <text x="256" y="455" font-family="Segoe UI, sans-serif" font-weight="600" font-size="12" fill="#8E96A7" text-anchor="middle" letter-spacing="0.5">gebor2011.github.io/shield/</text>
        <text x="256" y="475" font-family="Segoe UI, sans-serif" font-weight="700" font-size="11" fill="#00D2FF" text-anchor="middle" letter-spacing="1">Служба экспресс-анализа и стресс-тестов</text>
    </svg>

</body>
</html>
