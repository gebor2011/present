<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Capital Shield AI — Premium Banner</title>
    <style>
        body { margin: 0; padding: 0; background: #0F111A; display: flex; justify-content: center; align-items: center; height: 100vh; }
        svg { background: #0F111A; box-shadow: 0 30px 70px rgba(0,0,0,0.6); border-radius: 16px; }
    </style>
</head>
<body>

    <svg xmlns="http://w3.org" viewBox="0 0 1024 512" width="1024" height="512">
        <!-- ТЕХНОЛОГИЧНЫЙ КИБЕР-ФОН -->
        <rect width="1024" height="512" fill="#0F111A"/>
        <defs>
            <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.05"/>
                <stop offset="50%" stop-color="#0F111A" stop-opacity="1"/>
                <stop offset="100%" stop-color="#00E676" stop-opacity="0.03"/>
            </linearGradient>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFEAA7"/>
                <stop offset="50%" stop-color="#D4AF37"/>
                <stop offset="100%" stop-color="#AA820A"/>
            </linearGradient>
            <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#00D2FF"/>
                <stop offset="100%" stop-color="#0088FF"/>
            </linearGradient>
        </defs>
        <rect width="1024" height="512" fill="url(#bgGlow)"/>
        <circle cx="512" cy="256" r="380" fill="none" stroke="#2A2F3F" stroke-width="1" stroke-dasharray="4,8" opacity="0.3"/>

        <!-- ГЛАВНЫЕ ЗАГОЛОВКИ -->
        <text x="512" y="65" font-family="Segoe UI, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CAPITAL SHIELD AI</text>
        <text x="512" y="102" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14" fill="url(#cyberGrad)" text-anchor="middle" letter-spacing="3">AI-POWERED DUE DILIGENCE FOR SERIOUS INVESTORS</text>

        <!-- ЛЕВАЯ ЧАСТЬ: ТРАДИЦИОННЫЙ АУДИТ (ЗОЛОТОЙ 3D-ЩИТ) -->
        <g transform="translate(210, 240)">
            <!-- Тень под щитом -->
            <path d="M0 -90 L65 -70 L65 20 C65 65 32 100 0 115 C-32 100 -65 65 -65 20 L-65 -70 Z" fill="#000000" opacity="0.3" transform="translate(5, 10)"/>
            <!-- Тело щита -->
            <path d="M0 -90 L65 -70 L65 20 C65 65 32 100 0 115 C-32 100 -65 65 -65 20 L-65 -70 Z" fill="#161A26" stroke="url(#goldGrad)" stroke-width="4"/>
            <path d="M0 -80 L53 -63 L53 15 C53 53 26 83 0 96 C-26 83 -53 15 -53 15 L-53 -63 Z" fill="#1C2234" opacity="0.5"/>
            <!-- Текст -->
            <text x="0" y="-25" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="12" fill="#8E96A7" text-anchor="middle" letter-spacing="0.5">ТРАДИЦИОННЫЙ АУДИТ</text>
            <text x="0" y="15" font-family="Segoe UI, sans-serif" font-weight="900" font-size="24" fill="url(#goldGrad)" text-anchor="middle">$5,000 - $50,000+</text>
            <text x="0" y="45" font-family="Segoe UI, sans-serif" font-weight="600" font-size="11" fill="#8E96A7" text-anchor="middle">Дорого / Только для B2B</text>
        </g>

        <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ: БРЕНД СЕРВИСА (НЕОНОВЫЙ КИБЕР-ЩИТ) -->
        <g transform="translate(512, 240)">
            <!-- Внешнее неоновое свечение щита -->
            <path d="M0 -105 L75 -82 L75 25 C75 75 37 115 0 132 C-37 115 -75 75 -75 25 L-75 -82 Z" fill="none" stroke="#00D2FF" stroke-width="8" opacity="0.15"/>
            <!-- Тело щита -->
            <path d="M0 -105 L75 -82 L75 25 C75 75 37 115 0 132 C-37 115 -75 75 -75 25 L-75 -82 Z" fill="#161A26" stroke="url(#cyberGrad)" stroke-width="4.5"/>
            <path d="M0 -93 L63 -74 L63 20 C63 62 31 95 0 110 C-31 95 -63 20 -63 20 L-63 -74 Z" fill="#1F263A" opacity="0.6"/>
            <!-- Текстовый блок тарифов -->
            <text x="0" y="-35" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">CAPITAL SHIELD AI</text>
            <text x="0" y="-12" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="10" fill="#8E96A7" text-anchor="middle">ЭКСПРЕСС-ТАРИФЫ</text>
            <!-- Фиксация вашей новой цены 10 - 40 долл -->
            <text x="0" y="32" font-family="Segoe UI, sans-serif" font-weight="900" font-size="34" fill="#00E676" text-anchor="middle">$10 - $40</text>
            <text x="0" y="60" font-family="Segoe UI, sans-serif" font-weight="700" font-size="11" fill="#00D2FF" text-anchor="middle" letter-spacing="0.5">МГНОВЕННЫЙ ОНЧЕЙН-ТЕСТ</text>
        </g>

        <!-- ПРАВАЯ ЧАСТЬ: ТРИ ВАШИ КЛЮЧЕВЫЕ УСЛУГИ (БЕЗ ОПЕЧАТОК) -->
        <g transform="translate(710, 205)" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#F5F6FA" letter-spacing="0.5">
            <!-- Блок 1 -->
            <g transform="translate(0, 0)">
                <text x="0" y="20">📄 ЭКСПРЕСС-АНАЛИЗ КОДА</text>
                <text x="24" y="38" font-size="11" font-weight="600" fill="#8E96A7">Сканирование смарт-контрактов на баги</text>
            </g>
            <!-- Блок 2 -->
            <g transform="translate(0, 55)">
                <text x="0" y="20">📊 DUE DILIGENCE ПРОЕКТОВ</text>
                <text x="24" y="38" font-size="11" font-weight="600" fill="#8E96A7">Комплексный аудит финансовой модели</text>
            </g>
            <!-- Блок 3 -->
            <g transform="translate(0, 110)">
                <text x="0" y="20">📈 АНАЛИЗ ДОХОДНОСТИ</text>
                <text x="24" y="38" font-size="11" font-weight="600" fill="#8E96A7">ИИ-расчет кассового разрыва «Форпост»</text>
            </g>
        </g>

        <!-- НИЖНЯЯ ПАНЕЛЬ С АДРЕСОМ ВАШЕГО САЙТА -->
        <g transform="translate(512, 440)">
            <rect x="-160" y="-20" width="320" height="38" rx="10" fill="#161A26" stroke="#2A2F3F" stroke-width="1.5"/>
            <text x="0" y="4" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="13" fill="#8E96A7" text-anchor="middle" letter-spacing="1">gebor2011.github.io/shield/</text>
        </g>
    </svg>

</body>
</html>
