            <!-- Матричный код, проявляющийся под действием кисти и лупы -->
            <g fill="#00E676" font-family="monospace" font-size="12" font-weight="bold" opacity="0.8">

                <text x="40" y="70">0110101</text>
                <text x="15" y="90">1100101</text>

            <g fill="#FF3B30" font-family="Segoe UI" font-weight="900" font-size="14" opacity="0.8" letter-spacing="2">
