<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Capital Shield AI — Рекламный Баннер 1</title>
    <style>
        body { margin: 0; padding: 0; background: #07090F; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
        svg { background: #07090F; box-shadow: 0 25px 60px rgba(0,0,0,0.7); border-radius: 50%; }
    </style>
</head>
<body>

    <svg xmlns="http://w3.org" viewBox="0 0 1000 1000" width="800" height="800">
        <!-- ФОНОВЫЙ ЦИФРОВОЙ КРУГ -->
        <circle cx="500" cy="500" r="470" fill="#0A0E1A" stroke="#1A263F" stroke-width="4"/>
        <circle cx="500" cy="500" r="455" fill="none" stroke="#101B2B" stroke-width="2" stroke-dasharray="10,15"/>
        <circle cx="500" cy="500" r="410" fill="none" stroke="#1A2D4A" stroke-width="1" opacity="0.5"/>

        <!-- ТЕХНОЛОГИЧНАЯ СЕТКА И БИНАРНЫЙ КОД НА ЗАДНЕМ ПЛАНЕ -->
        <g opacity="0.08" fill="#00D2FF" font-family="Courier, monospace" font-size="12">
            <text x="80" y="300">10101101 01101 1001</text>
            <text x="80" y="330">01011001 11010 0110</text>
            <text x="80" y="360">11011010 00110 1011</text>
            <text x="820" y="300">00110110 11011 0011</text>
            <text x="820" y="330">10101001 01100 1101</text>
            <text x="820" y="360">01101101 10011 0110</text>
        </g>

        <!-- ГЛАВНЫЙ ЗОЛОТОЙ ЩИТ С БИНАРНОЙ МАТРИЦЕЙ -->
        <g transform="translate(500, 310)">
            <!-- Внешний контур щита -->
            <path d="M0 -170 L140 -120 L140 30 C140 110 70 170 0 190 C-70 170 -140 110 -140 30 L-140 -120 Z" fill="#131A2E" stroke="#5F6B7D" stroke-width="6"/>
            <!-- Внутренний золотой щит -->
            <path d="M0 -155 L125 -110 L125 25 C125 95 62 150 0 170 C-62 150 -125 95 -125 25 L-125 -110 Z" fill="#181F36" stroke="#D4AF37" stroke-width="4"/>
            <path d="M0 -145 L115 -103 L115 20 C115 85 57 135 0 153 C-57 135 -115 85 -115 20 L-115 -103 Z" fill="#1C2440" stroke="#AA820A" stroke-width="1.5"/>
            
            <!-- Свечение и бинарный код внутри золотого щита -->
            <g fill="#D4AF37" font-family="monospace" font-size="11" font-weight="bold" opacity="0.35" text-anchor="middle">
                <text x="0" y="-100">10101010</text>
                <text x="0" y="-80">0101011010100011</text>
                <text x="0" y="-60">101101011000110000</text>
                <text x="0" y="-40">1011001101 011011010</text>
                <text x="0" y="-20">101011 110 10101</text>
                <text x="0" y="0">101101 1011000110 1010</text>
                <text x="0" y="20">11011 001010110 011</text>
                <text x="0" y="40">10101 111010101 101</text>
                <text x="0" y="60">0101 101011011 110</text>
                <text x="0" y="80">01011 0110101 01101</text>
                <text x="0" y="100">10011 101 01010</text>
                <text x="0" y="120">00111 10101</text>
            </g>
        </g>

        <!-- ЛЕВАЯ СТОРОНА: РОБОТИЗИРОВАННАЯ РУКА И КИСТЬ -->
        <g transform="translate(290, 390)">
            <!-- Металлическое предплечье и кисть -->
            <path d="M-110 60 L-30 0 L10 -10 L15 15 L-20 40 L-90 90 Z" fill="#1C2536" stroke="#5F6B7D" stroke-width="3"/>
            <!-- Стилизованная золотая кисть археолога / криминалиста -->
            <path d="M5 -15 L25 -45 C45 -75 75 -95 105 -105 L125 -65 C100 -55 75 -35 55 -5 L25 10 Z" fill="#AA820A" stroke="#D4AF37" stroke-width="2"/>
            <path d="M25 -45 L70 -5 C80 -15 70 -35 55 -5" fill="none" stroke="#D4AF37" stroke-width="2"/>
            <!-- Ворсинки кисти (световые линии) -->
            <path d="M105 -105 L135 -135 M112 -95 L147 -120 M120 -85 L155 -105 M125 -75 L160 -90 M125 -65 L162 -75" stroke="#D4AF37" stroke-width="3"/>
            
            <!-- Механические пальцы робо-руки, сжимающие кисть -->
            <circle cx="15" cy="5" r="10" fill="#3A4B6E" stroke="#5F6B7D" stroke-width="2"/>
            <path d="M15 5 C30 15 45 10 50 -5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
            <path d="M10 12 C25 25 35 20 42 5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
            <path d="M5 20 C18 30 28 25 32 12" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        </g>

        <!-- ПРАВАЯ СТОРОНА: КРИМИНАЛИСТИЧЕСКАЯ ЛУПА -->
        <g transform="translate(680, 360)">
            <!-- Ручка лупы -->
            <path d="M40 40 L170 170" stroke="#AA820A" stroke-width="22" stroke-linecap="round"/>
            <path d="M45 45 L165 165" stroke="#D4AF37" stroke-width="14" stroke-linecap="round"/>
            <path d="M55 55 L125 125" stroke="#FFEAA7" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
            <!-- Стальная оправа линзы -->
            <circle cx="0" cy="0" r="95" fill="none" stroke="#1A263F" stroke-width="16"/>
            <circle cx="0" cy="0" r="95" fill="none" stroke="#00D2FF" stroke-width="8"/>
            <!-- Стекло линзы с неоновым бликом -->
            <circle cx="0" cy="0" r="87" fill="#00D2FF" opacity="0.12"/>
            <path d="M-55 -45 A 70 70 0 0 1 45 -55" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
        </g>

        <!-- МАЛЕНЬКИЙ ЩИТ С ИСПРАВЛЕННЫМ ТЕХНОЛОГИЧНЫМ QR-КОДОМ -->
        <g transform="translate(620, 560)">
            <path d="M0 -55 L45 -40 L45 10 C45 35 22 55 0 60 C-22 55 -45 35 -45 10 L-45 -40 Z" fill="#161A26" stroke="#D4AF37" stroke-width="2.5"/>
            <!-- Симуляция QR-кодовой матрицы -->
            <rect x="-25" y="-25" width="50" height="50" fill="#1C2440" rx="4"/>
            <!-- Поисковые узоры по углам QR -->
            <rect x="-21" y="-21" width="14" height="14" fill="none" stroke="#00D2FF" stroke-width="3"/>
            <rect x="7" y="-21" width="14" height="14" fill="none" stroke="#00D2FF" stroke-width="3"/>
            <rect x="-21" y="7" width="14" height="14" fill="none" stroke="#00D2FF" stroke-width="3"/>
            <circle cx="14" cy="14" r="2" fill="#00E676"/>
            <!-- Иконка Телеграма по центру QR-щитка -->
            <circle cx="0" cy="0" r="8" fill="#00D2FF"/>
            <path d="M-4 0 L4 -3 L1 3 Z" fill="#161A26"/>
        </g>

        <!-- ЦЕНТРАЛЬНЫЙ БЛОК НАЗВАНИЯ: ЗАМЕНЕНО НА CAPITAL SHIELD AI -->
        <g id="brand-text">
            <!-- Главное название (Золотой объемный градиент) -->
            <text x="500" y="730" font-family="Segoe UI, sans-serif" font-weight="900" font-size="76" fill="#D4AF37" text-anchor="middle" letter-spacing="2">
                CAPITAL SHIELD AI
            </text>
            <!-- Дублирующий белый слой для создания строгого канта -->
            <text x="500" y="727" font-family="Segoe UI, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle" letter-spacing="2" opacity="0.95">
                CAPITAL SHIELD AI
            </text>
        </g>

        <!-- ПОДЗАГОЛОВОК И НАПРАВЛЕНИЕ ДЕЯТЕЛЬНОСТИ -->
        <text x="500" y="805" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="28" fill="#8E96A7" text-anchor="middle" letter-spacing="4">
            ИИ-КРИМИНАЛИСТИКА &amp; АУДИТ
        </text>

        <!-- ЗНАК И ПЛАШКА КРИТИЧЕСКИХ УГРОЗ СКАМА -->
        <g transform="translate(500, 885)">
            <rect x="-90" y="-30" width="180" height="46" rx="8" fill="#1B1522" stroke="#FF3B30" stroke-width="1.5" opacity="0.8"/>
            <!-- Символ опасности / треугольник -->
            <path d="M-60 2 L-50 -16 L-40 2 Z" fill="#FF3B30"/>
            <text x="-50" y="0" font-family="Segoe UI" font-weight="bold" font-size="12" fill="#1B1522" text-anchor="middle">!</text>
            <!-- Текст предупреждения -->
            <text x="15" y="3" font-family="Segoe UI, sans-serif" font-weight="900" font-size="24" fill="#FF3B30" text-anchor="middle" letter-spacing="4">SCAM</text>
        </g>

        <!-- ДЕКОРАТИВНЫЕ СВЕТОВЫЕ ЗВЕЗДЫ ПО БОКАМ -->
        <path d="M120 780 L125 760 L130 780 L150 785 L130 790 L125 810 L120 790 L100 785 Z" fill="#FFFFFF" opacity="0.7"/>
        <path d="M880 780 L885 760 L890 780 L910 785 L890 790 L885 810 L880 790 L860 785 Z" fill="#FFFFFF" opacity="0.7"/>
    </svg>

</body>
</html>
